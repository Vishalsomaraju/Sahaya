# ==============================================================================
# Render Blueprint Configuration (render.yaml)
# Project: SAHAYA Healthcare Platform
# Live Web Service: https://sahaya-ag6r.onrender.com (ID: srv-db6h9ojl550s73asvrj0)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. SAHAYA Backend Express API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: sahaya-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --prefix server
    startCommand: npm run start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_ORIGIN
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      - key: AUTH_DISABLED
        value: "true"
      - key: WEARABLE_DEFAULT_PATIENT
        value: demo-patient
      - key: WEARABLE_POLL_INTERVAL_SEC
        value: "6"
      - key: LOG_LEVEL
        value: info
      - key: ANTHROPIC_API_KEY
        sync: false
